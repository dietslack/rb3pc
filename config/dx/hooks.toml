# Mid-asm hooks for Rock Band 3 Deluxe's executable (rb3pc-dx).

# A patch in DX's executable moved code out of sub_8275D670 into a cave at
# 0x82516324, reached by `b` from 0x8275D6E0 and branching back into the
# function. ReXGlue can't express a jump into another function's middle, so
# the hook does what the cave does (src/deluxe_exe.cpp):
#   lwz r4,4(r3); cmpwi r4,2; beq -> mr r4,r30; b 0x8275D6E4
#                             else -> b 0x8275D6F0
[[midasm_hook]]
address = 0x8275D6E0
name = "Rb3pcDxCave8275D6E0"
registers = ["r3", "r4", "r30"]
jump_address_on_true = 0x8275D6E4
jump_address_on_false = 0x8275D6F0

# The retail hooks (config/retail/hooks.toml, which explains each one) at the
# same code in this executable.

# VdSwap call in D3D Present (retail 0x828374BC).
[[midasm_hook]]
address = 0x82865EFC
name = "Rb3pcOnGuestFrame"

