# Codegen overrides for the retail disc executable
# (default.xex, title 45410914, version 0.0.0.1, built 2010-08-07).

# CRT setjmp/longjmp. Debug::Fail's TRY blocks (TheDebugJump) and about 20
# library error paths use them. ReXGlue must know them to implement them
# natively; recompiled as ordinary code, longjmp can't unwind to the setjmp
# site.
setjmp_address = 0x82B88A00
longjmp_address = 0x82B885D0
#
# Small leaf/tail-call functions with no .pdata entry that analysis misses.
# They are only reached through a tail branch (`b`), so they need explicit
# boundaries. Inspect them with tools/dis.sh.

